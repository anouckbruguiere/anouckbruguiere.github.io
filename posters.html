      HOW TO ADD A POSTER
      1. Put the poster image (PNG or JPG) in the "posters" folder, with a simple name (lowercase, no spaces, no accents).
      2. Copy one whole <li>...</li> block, paste it at the top of the list, and write the same file name in the two places
         (href="..." and src="...").
      3. If you also have a PDF, add a second link in the caption: <a href="posters/my-poster.pdf">pdf</a>
    -->
