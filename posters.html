    <h1>Posters</h1>

    <p>Click a poster to open it in full size.</p>

    <!--
      HOW TO ADD A POSTER
      1. Put the poster file in the "posters" folder, e.g. posters/poster-1.pdf (or .jpg / .png).
      2. Put a small preview image next to it, e.g. posters/poster-1.jpg (a screenshot or export of the poster, around 800 px wide is enough).
      3. Copy one whole <li>...</li> block below, paste it at the top of the list, and edit the file names and text.
      Until you add a preview, the grey "poster preview" placeholder is shown.
    -->

    <ul class="posters">
      <li>
        <figure>
          <a href="posters/poster-1.pdf">
            <img src="posters/placeholder.svg" alt="Poster: [Title of the poster]" loading="lazy">
          </a>
          <figcaption>
            <strong>[Title of the poster]</strong><br>
            [Conference name], [City], [Month year]<br>
            <a href="posters/poster-1.pdf">pdf</a>
          </figcaption>
        </figure>
      </li>

      <li>
        <figure>
          <a href="posters/poster-2.pdf">
            <img src="posters/placeholder.svg" alt="Poster: [Title of the poster]" loading="lazy">
          </a>

      </li>
    </ul>
