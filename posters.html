    <h1>Posters</h1>

    <p>Click a poster to open it in full size.</p>

    <!--
      HOW TO ADD A POSTER
      1. Put the poster file in the "posters" folder, with a simple name (lowercase, no spaces, no accents).
      2. Put a preview image next to it (e.g. posters/poster-paiss-2025.jpg, around 800 px wide) and use it in the <img> below.
         Until then the grey "poster preview" placeholder is shown.
      3. Copy one whole <li>...</li> block, paste it at the top of the list, and edit the file names and text.
    -->

    <ul class="posters">
      <li>
        <figure>
          <a href="posters/poster-paiss-2025.pdf">
            <img src="posters/placeholder.svg" alt="Poster: Autonomous fault prediction for rotating machines" loading="lazy">
          </a>
          <figcaption>
            <strong>Autonomous fault prediction for rotating machines</strong><br>
            PAISS, Inria, September 2025<br>
            <span class="award">Best poster award</span><br>
            <a href="posters/poster-paiss-2025.pdf">pdf</a>
          </figcaption>
        </figure>
      </li>

      <li>
        <figure>
          <a href="posters/poster-cwr.pdf">
            <img src="posters/placeholder.svg" alt="Poster: [Title of the poster]" loading="lazy">
          </a>
          <figcaption>
            <strong>[Title of the poster]</strong><br>
            [Event], [City], [Month year]<br>
            <a href="posters/poster-cwr.pdf">pdf</a>
          </figcaption>
        </figure>
      </li>
    </ul>

    <footer>Built with chaos and rotating parts. Last updated November 2026.</footer>
